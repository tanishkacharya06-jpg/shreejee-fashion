<div class="pin-check" data-pin-check data-url="{{ url_for('api_check_pin') }}"><label class="pin-check-label" for="pinInput{{ pin_id|default('') }}">Delivery PIN code</label><div class="pin-check-row"><input id="pinInput{{ pin_id|default('') }}" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit PIN" value="{{ saved_pin() }}" autocomplete="postal-code"><button type="button" class="btn btn-outline" data-pin-btn>Check</button></div><p class="small pin-check-result" data-pin-result aria-live="polite"></p></div>
