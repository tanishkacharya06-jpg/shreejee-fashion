name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShreejeeFashion-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ShreejeeFashion.apk
          gh release create "apk-build-${{ github.run_number }}" ShreejeeFashion.apk \
            --title "Shreejee Fashion APK (build ${{ github.run_number }})" \
            --notes "Debug APK. Download ShreejeeFashion.apk, uninstall the old app first, then install." \
            --latest
